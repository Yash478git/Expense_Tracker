{% extends "admin/base.html" %}
{% load static %}

{% block title %}
    {{ title }} | Expense Tracker
{% endblock %}


{% block extrastyle %}

{{ block.super }}

<style>

/* =========================================================
   EXPENSE TRACKER ADMIN
   Dashboard-style visual system
   ========================================================= */

:root {

    --et-primary: #6366f1;
    --et-primary-dark: #4f46e5;
    --et-primary-light: #eef2ff;

    --et-background: #f5f7fb;
    --et-card: #ffffff;

    --et-border: #e5e7eb;

    --et-text: #1f2937;
    --et-text-secondary: #6b7280;
    --et-text-muted: #9ca3af;

    --et-success: #059669;
    --et-danger: #dc2626;

    --et-shadow-sm:
        0 3px 12px rgba(15, 23, 42, 0.05);

    --et-shadow-md:
        0 8px 22px rgba(15, 23, 42, 0.07);

}


/* =========================================================
   GLOBAL
   ========================================================= */

html,
body {

    background: var(--et-background) !important;

    color: var(--et-text) !important;

}


body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}


/* =========================================================
   CONTAINER
   ========================================================= */

#container {

    background: transparent !important;

    min-width: 0;

}


/* =========================================================
   HEADER
   ========================================================= */

#header {

    min-height: 68px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #6366f1
        ) !important;

    padding: 0 28px;

    display: flex;

    align-items: center;

    box-shadow:
        0 4px 18px rgba(79, 70, 229, 0.16);

}


#branding {

    display: flex;

    align-items: center;

}


#branding h1 {

    margin: 0;

    padding: 0;

    font-size: 21px;

    font-weight: 750;

    letter-spacing: 0.1px;

}


#branding h1 a {

    color: #ffffff !important;

    text-decoration: none;

}


#branding h1 a:hover {

    color: #ffffff !important;

}


/* =========================================================
   USER TOOLS
   ========================================================= */

#user-tools {

    margin-left: auto;

    color: rgba(255, 255, 255, 0.92) !important;

    font-size: 12px;

}


#user-tools a {

    color: #ffffff !important;

    font-weight: 600;

    text-decoration: none;

}


#user-tools a:hover {

    text-decoration: underline;

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

#content {

    padding: 28px;

    max-width: 1450px;

}


#content-main {

    width: 100%;

}


/* =========================================================
   BREADCRUMBS
   ========================================================= */

div.breadcrumbs {

    background: #ffffff !important;

    border: 1px solid var(--et-border);

    border-radius: 11px;

    padding: 11px 15px;

    margin-bottom: 22px;

    color: var(--et-text-secondary) !important;

    box-shadow: var(--et-shadow-sm);

}


div.breadcrumbs a {

    color: var(--et-primary) !important;

    font-weight: 600;

}


/* =========================================================
   MODULE CARDS
   ========================================================= */

.module {

    background: #ffffff !important;

    color: var(--et-text) !important;

    border: 1px solid var(--et-border);

    border-radius: 16px;

    overflow: hidden;

    margin-bottom: 22px;

    box-shadow: var(--et-shadow-sm);

}


.module:hover {

    box-shadow: var(--et-shadow-md);

}


/* Module headers */

.module caption,
.module h2 {

    background: #f8fafc !important;

    color: var(--et-text) !important;

    padding: 15px 18px;

    border-bottom: 1px solid var(--et-border);

    font-size: 14px;

    font-weight: 700;

}


.module caption a,
.module h2 a {

    color: var(--et-text) !important;

}


/* =========================================================
   DASHBOARD MODEL ROWS
   ========================================================= */

#content-main .module table {

    width: 100%;

    background: #ffffff !important;

}


#content-main .module table tbody {

    background: #ffffff !important;

}


#content-main .module table tr {

    background: #ffffff !important;

    color: var(--et-text) !important;

}


#content-main .module table tr:hover {

    background: #fafbff !important;

}


#content-main .module table th,
#content-main .module table td {

    padding: 13px 16px;

    font-size: 13px;

    background: #ffffff !important;

    color: var(--et-text) !important;

    border-bottom: 1px solid #eef0f3 !important;

}


#content-main .module table tr:last-child th,
#content-main .module table tr:last-child td {

    border-bottom: none !important;

}


/* Model names */

#content-main .module table th a {

    color: #374151 !important;

    font-weight: 700;

}


/* Add / Change links */

#content-main .module table td a {

    color: var(--et-primary) !important;

    font-weight: 600;

}


#content-main .module table td a:hover {

    color: var(--et-primary-dark) !important;

}


/* =========================================================
   RECENT ACTIONS
   ========================================================= */

#recent-actions-module {

    width: 320px !important;

    background: #ffffff !important;

    color: var(--et-text) !important;

    border: 1px solid var(--et-border) !important;

    border-radius: 16px !important;

    overflow: hidden !important;

    box-shadow: var(--et-shadow-sm) !important;

    margin-bottom: 22px !important;

    padding-bottom: 6px !important;

}


/* Recent actions heading */

#recent-actions-module h2 {

    margin: 0 !important;

    padding: 16px 18px !important;

    background: #f8fafc !important;

    color: var(--et-text) !important;

    border-bottom: 1px solid var(--et-border) !important;

    font-size: 17px !important;

    font-weight: 700 !important;

}


/* My actions heading */

#recent-actions-module h3 {

    margin: 0 !important;

    padding: 15px 18px 8px !important;

    background: #ffffff !important;

    color: var(--et-text-secondary) !important;

    font-size: 11px !important;

    font-weight: 700 !important;

    text-transform: uppercase !important;

    letter-spacing: 0.4px !important;

}


/* Action list */

#recent-actions-module .actionlist {

    margin: 0 !important;

    padding: 0 18px 8px !important;

    background: #ffffff !important;

}


/* Individual action */

#recent-actions-module .actionlist li {

    margin: 0 !important;

    padding: 10px 0 !important;

    background: #ffffff !important;

    color: var(--et-text) !important;

    border-bottom: 1px solid #eef0f3 !important;

    line-height: 1.35 !important;

}


/* Last action */

#recent-actions-module .actionlist li:last-child {

    border-bottom: none !important;

}


/* Action links */

#recent-actions-module .actionlist li a {

    color: var(--et-primary) !important;

    font-size: 12px !important;

    font-weight: 600 !important;

    text-decoration: none !important;

}


#recent-actions-module .actionlist li a:hover {

    color: var(--et-primary-dark) !important;

    text-decoration: underline !important;

}


/* Object type */

#recent-actions-module .mini.quiet {

    display: block !important;

    margin-top: 3px !important;

    color: var(--et-text-muted) !important;

    font-size: 10px !important;

}


/* Recent actions internal elements */

#recent-actions-module ul,
#recent-actions-module li,
#recent-actions-module p {

    box-sizing: border-box !important;

}


/* Remove default dark backgrounds */

#recent-actions-module,
#recent-actions-module ul,
#recent-actions-module li,
#recent-actions-module .module {

    background-color: #ffffff !important;

}


/* Responsive */

@media (max-width: 1100px) {

    #recent-actions-module {

        width: 100% !important;

    }

}


/* =========================================================
   CHANGE LIST TABLE
   ========================================================= */

#changelist {

    background: transparent !important;

}


#result_list {

    width: 100%;

    background: #ffffff !important;

    border: none;

}


#result_list thead {

    background: #f8fafc !important;

}


#result_list thead th {

    background: #f8fafc !important;

    color: #64748b !important;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.35px;

    padding: 13px 14px;

    border-bottom: 1px solid var(--et-border);

}


#result_list tbody {

    background: #ffffff !important;

}


#result_list tbody tr {

    background: #ffffff !important;

}


#result_list tbody tr:hover {

    background: #fafbff !important;

}


#result_list tbody td,
#result_list tbody th {

    padding: 12px 14px;

    font-size: 13px;

    color: var(--et-text) !important;

    background: #ffffff !important;

    border-bottom: 1px solid #eef0f3 !important;

}


#result_list tbody tr:last-child td,
#result_list tbody tr:last-child th {

    border-bottom: none !important;

}


#result_list a {

    color: var(--et-primary) !important;

    font-weight: 600;

}


#result_list a:hover {

    color: var(--et-primary-dark) !important;

}


/* =========================================================
   SEARCH BAR
   ========================================================= */

#toolbar {

    background: #ffffff !important;

    border: 1px solid var(--et-border);

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 18px;

    box-shadow: var(--et-shadow-sm);

}


#toolbar input[type="text"] {

    border: 1px solid var(--et-border) !important;

    border-radius: 9px !important;

    padding: 10px 12px !important;

    min-height: 40px;

    background: #ffffff !important;

    color: var(--et-text) !important;

}


#toolbar input[type="submit"] {

    min-height: 40px;

}


/* =========================================================
   FORMS
   ========================================================= */

fieldset.module {

    background: #ffffff !important;

}


input,
textarea,
select {

    border: 1px solid var(--et-border) !important;

    border-radius: 9px !important;

    background: #ffffff !important;

    color: var(--et-text) !important;

    box-sizing: border-box;

}


input:focus,
textarea:focus,
select:focus {

    border-color: var(--et-primary) !important;

    box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.10) !important;

    outline: none !important;

}


.aligned label {

    color: #374151 !important;

    font-size: 13px;

    font-weight: 650;

}


.help,
p.help {

    color: var(--et-text-muted) !important;

    font-size: 11px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

input[type="submit"],
.button,
button,
a.button {

    border-radius: 9px !important;

    font-size: 12px !important;

    font-weight: 650 !important;

    transition: 0.2s ease;

}


input[type="submit"] {

    background: var(--et-primary) !important;

    color: #ffffff !important;

    border: none !important;

}


input[type="submit"]:hover {

    background: var(--et-primary-dark) !important;

    transform: translateY(-1px);

}


.submit-row {

    background: #ffffff !important;

    border: 1px solid var(--et-border);

    border-radius: 13px;

    padding: 15px;

    margin-top: 18px;

}


.submit-row input {

    min-height: 40px;

}


/* =========================================================
   OBJECT TOOLS
   ========================================================= */

.object-tools a {

    background: var(--et-primary) !important;

    color: #ffffff !important;

    border-radius: 9px !important;

    padding: 9px 14px !important;

    font-size: 12px !important;

    font-weight: 650 !important;

    box-shadow: none !important;

}


.object-tools a:hover {

    background: var(--et-primary-dark) !important;

}


/* =========================================================
   FILTER PANEL
   ========================================================= */

#changelist-filter {

    background: #ffffff !important;

    border: 1px solid var(--et-border);

    border-radius: 14px;

    box-shadow: var(--et-shadow-sm);

    overflow: hidden;

}


#changelist-filter h2 {

    background: #f8fafc !important;

    color: var(--et-text) !important;

    font-size: 13px;

    border-bottom: 1px solid var(--et-border);

}


#changelist-filter h3 {

    color: #64748b !important;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

}


#changelist-filter li {

    background: #ffffff !important;

}


#changelist-filter li.selected a {

    color: var(--et-primary) !important;

    font-weight: 700;

}


/* =========================================================
   ACTION BAR
   ========================================================= */

.actions {

    background: #f8fafc !important;

    border: 1px solid var(--et-border);

    border-radius: 11px;

    margin-bottom: 14px;

    padding: 10px;

}


.actions select {

    min-height: 36px;

}


.actions button {

    min-height: 36px;

    background: var(--et-primary) !important;

    color: #ffffff !important;

    border: none;

}


/* =========================================================
   PAGINATION
   ========================================================= */

.paginator {

    margin-top: 15px;

    color: var(--et-text-secondary) !important;

    font-size: 12px;

}


.paginator a {

    color: var(--et-primary) !important;

    font-weight: 600;

}


/* =========================================================
   MESSAGES
   ========================================================= */

ul.messagelist {

    margin-bottom: 20px;

}


ul.messagelist li {

    border-radius: 11px;

    border: 1px solid var(--et-border);

    box-shadow: var(--et-shadow-sm);

    font-size: 12px;

}


/* =========================================================
   LOGIN
   ========================================================= */

body.login {

    background:
        linear-gradient(
            135deg,
            #f5f7fb,
            #eef2ff
        ) !important;

}


body.login #container {

    background: transparent !important;

}


body.login #header {

    justify-content: center;

    border-radius: 0 0 18px 18px;

}


body.login #content-main {

    background: #ffffff !important;

    border: 1px solid var(--et-border);

    border-radius: 18px;

    padding: 30px;

    box-shadow: var(--et-shadow-md);

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 900px) {

    #header {

        padding: 0 15px;

    }

    #content {

        padding: 20px 12px;

    }

}


@media (max-width: 600px) {

    #branding h1 {

        font-size: 18px;

    }

    #user-tools {

        font-size: 10px;

    }

    #recent-actions-module {

        width: 100% !important;

    }

}

</style>

{% endblock %}


{% block branding %}

<h1 id="site-name">

    <a href="{% url 'admin:index' %}">
        Expense Tracker
    </a>

</h1>

{% endblock %}
