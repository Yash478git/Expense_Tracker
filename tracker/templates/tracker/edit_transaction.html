{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Transaction - Expense Tracker</title>


    <!-- Global Styles -->
    <link
        rel="stylesheet"
        href="{% static 'tracker/css/style.css' %}"
    >


    <!-- Global Theme -->
    <link
        rel="stylesheet"
        href="{% static 'tracker/theme.css' %}"
    >


    <!-- Expense Tracker Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="{% static 'tracker/favicon.png' %}?v=3"
    >

    <link
        rel="shortcut icon"
        href="{% static 'tracker/favicon.png' %}?v=3"
    >


    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        body {
            background: #f5f7fb;
        }


        .page {
            min-height: 100vh;
            padding: 30px;
        }


        .page-container {
            width: min(900px, 94%);
            margin: auto;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;
            margin-bottom: 25px;
        }


        .page-header h1 {
            font-size: 30px;
            margin-bottom: 5px;

            color: #111827;

            transition: color 0.25s ease;
        }


        .page-header p {
            color: #6b7280;
            font-size: 14px;

            transition: color 0.25s ease;
        }


        .back-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 10px 15px;

            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 9px;

            color: #374151;

            font-size: 13px;
            font-weight: 600;

            box-shadow: var(--shadow-sm);

            transition:
                0.2s ease,
                background-color 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;
        }


        .back-btn:hover {
            color: #4f46e5;

            border-color: #6366f1;

            transform: translateY(-1px);
        }


        /* =====================================================
           FORM CARD
           ===================================================== */

        .form-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 32px;

            box-shadow: var(--shadow-sm);

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        .form-intro {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 30px;

            padding-bottom: 22px;

            border-bottom: 1px solid #e5e7eb;

            transition:
                border-color 0.25s ease;
        }


        .intro-icon {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 12px;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 21px;
        }


        .form-intro h2 {
            font-size: 18px;

            margin-bottom: 2px;

            color: #111827;

            transition:
                color 0.25s ease;
        }


        .form-intro p {
            color: #9ca3af;

            font-size: 12px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        .transaction-form p {
            margin-bottom: 20px;
        }


        .transaction-form label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 13px;

            font-weight: 600;

            transition:
                color 0.25s ease;
        }


        .transaction-form input,
        .transaction-form select,
        .transaction-form textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #e5e7eb;

            border-radius: 9px;

            background: white;

            color: #374151;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background-color 0.25s ease,
                color 0.25s ease,
                box-shadow 0.2s ease;
        }


        .transaction-form input::placeholder,
        .transaction-form textarea::placeholder {
            color: #94a3b8;
        }


        .transaction-form input:focus,
        .transaction-form select:focus,
        .transaction-form textarea:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, 0.1);
        }


        .transaction-form textarea {
            min-height: 100px;

            resize: vertical;
        }


        .transaction-form .helptext,
        .transaction-form .help-text {
            display: block;

            margin-top: 5px;

            color: #9ca3af;

            font-size: 11px;
        }


        .errorlist {
            list-style: none;

            margin: 6px 0 0;

            padding: 0;

            color: #dc2626;

            font-size: 12px;
        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid #e5e7eb;

            transition:
                border-color 0.25s ease;
        }


        .cancel-btn,
        .update-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 140px;

            padding: 12px 18px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .cancel-btn {
            background: #f8fafc;

            border: 1px solid #e5e7eb;

            color: #4b5563;
        }


        .cancel-btn:hover {
            background: #f1f5f9;

            transform: translateY(-1px);
        }


        .update-btn {
            border: none;

            background: #6366f1;

            color: white;
        }


        .update-btn:hover {
            background: #4f46e5;

            transform: translateY(-1px);

            box-shadow:
                0 6px 15px
                rgba(99, 102, 241, 0.2);
        }


        /* =====================================================
           DARK MODE
           ===================================================== */

        html[data-theme="dark"] body {
            background:
                radial-gradient(
                    circle at top left,
                    rgba(77, 91, 160, 0.10),
                    transparent 30%
                ),
                #0b1020;
        }


        html[data-theme="dark"] .page-header h1 {
            color: #f8fafc;
        }


        html[data-theme="dark"] .page-header p {
            color: #9da7ba;
        }


        html[data-theme="dark"] .back-btn {
            background: #151b2d;

            border-color: #2b354d;

            color: #cbd5e1;

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.18);
        }


        html[data-theme="dark"] .back-btn:hover {
            background: #1a2235;

            border-color: #6366f1;

            color: #a5b4fc;
        }


        html[data-theme="dark"] .form-card {
            background:
                linear-gradient(
                    180deg,
                    #151b2d 0%,
                    #121827 100%
                );

            border-color: #2b354d;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.22);
        }


        html[data-theme="dark"] .form-intro {
            border-bottom-color: #2b354d;
        }


        html[data-theme="dark"] .intro-icon {
            background:
                rgba(99, 102, 241, 0.15);

            color: #a5b4fc;
        }


        html[data-theme="dark"] .form-intro h2 {
            color: #f8fafc;
        }


        html[data-theme="dark"] .form-intro p {
            color: #8f9ab0;
        }


        html[data-theme="dark"] .transaction-form label {
            color: #cbd5e1;
        }


        html[data-theme="dark"] .transaction-form input,
        html[data-theme="dark"] .transaction-form select,
        html[data-theme="dark"] .transaction-form textarea {
            background: #0f1728;

            border-color: #34405a;

            color: #f8fafc;
        }


        html[data-theme="dark"] .transaction-form input::placeholder,
        html[data-theme="dark"] .transaction-form textarea::placeholder {
            color: #778198;
        }


        html[data-theme="dark"] .transaction-form input:focus,
        html[data-theme="dark"] .transaction-form select:focus,
        html[data-theme="dark"] .transaction-form textarea:focus {
            background: #121a2d;

            border-color: #718cf5;

            box-shadow:
                0 0 0 3px
                rgba(113, 140, 245, 0.16);
        }


        html[data-theme="dark"] .transaction-form .helptext,
        html[data-theme="dark"] .transaction-form .help-text {
            color: #8792a8;
        }


        html[data-theme="dark"] .errorlist {
            color: #ff8d8d;
        }


        html[data-theme="dark"] .form-actions {
            border-top-color: #2b354d;
        }


        html[data-theme="dark"] .cancel-btn {
            background: #1b2338;

            border-color: #34405a;

            color: #cbd5e1;
        }


        html[data-theme="dark"] .cancel-btn:hover {
            background: #252e43;

            border-color: #465673;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 650px) {

            .page {
                padding: 20px 12px;
            }


            .page-container {
                width: 100%;
            }


            .page-header {
                flex-direction: column;
            }


            .back-btn {
                width: 100%;
            }


            .form-card {
                padding: 22px 18px;
            }


            .form-actions {
                flex-direction: column-reverse;
            }


            .cancel-btn,
            .update-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="page">

    <div class="page-container">


        <!-- ================= HEADER ================= -->

        <div class="page-header">


            <div>

                <h1>
                    Edit Transaction
                </h1>

                <p>
                    Update the details of your transaction.
                </p>

            </div>


            <a
                href="{% url 'transaction_list' %}"
                class="back-btn"
            >
                ← Transactions
            </a>

        </div>


        <!-- ================= FORM ================= -->

        <div class="form-card">


            <div class="form-intro">


                <div class="intro-icon">
                    ✎
                </div>


                <div>

                    <h2>
                        Update Transaction Details
                    </h2>

                    <p>
                        Make the necessary changes and save them.
                    </p>

                </div>


            </div>


            <form
                method="POST"
                class="transaction-form"
            >

                {% csrf_token %}

                {{ form.as_p }}


                <div class="form-actions">


                    <a
                        href="{% url 'transaction_list' %}"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="update-btn"
                    >
                        Update Transaction
                    </button>


                </div>


            </form>


        </div>


    </div>

</div>


<!-- Global Theme Script -->
<script src="{% static 'tracker/theme.js' %}"></script>


</body>

</html>
